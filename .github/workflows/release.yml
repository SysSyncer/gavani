# Release workflow: builds native binaries for every supported OS and
# attaches them to a GitHub Release when a version tag is pushed.
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The resulting assets (gavani-vX.Y.Z-<target>.tar.gz / .zip) are what the
# Homebrew formula, Scoop manifest, winget manifest, and AUR -bin PKGBUILD
# all reference — publish a release before submitting to those registries.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dir="gavani-${VERSION}"
          mkdir -p "$dir"
          cp target/${{ matrix.target }}/release/gavani "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "gavani-${VERSION}-${{ matrix.target }}.tar.gz" "$dir"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $dir = "gavani-$version"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/${{ matrix.target }}/release/gavani.exe $dir/
          Copy-Item README.md, LICENSE $dir/
          Compress-Archive -Path $dir -DestinationPath "gavani-$version-${{ matrix.target }}.zip"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # ref_name is "vX.Y.Z" but archives are named "gavani-X.Y.Z-<target>"
          files: gavani-*-${{ matrix.target }}.${{ matrix.archive }}
