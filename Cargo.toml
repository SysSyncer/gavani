[package]
name = "gavani"
version = "0.1.0"
edition = "2024"
description = "A focus stopwatch TUI: record focus sessions with start, end, and duration."
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
lto = true
strip = true

# Debian packaging via cargo-deb (`cargo install cargo-deb && cargo deb`).
# Produces target/debian/gavani_0.1.0-1_amd64.deb, installable with
# `sudo apt install ./gavani_...deb` or uploaded to a PPA/apt repo.
[package.metadata.deb]
maintainer = "SysSyncer <https://github.com/SysSyncer>"
copyright = "2026 SysSyncer"
license-file = ["LICENSE", "0"]
depends = "libc6 (>= 2.31), libgcc-s1"
section = "utils"
priority = "optional"
extended-description = """\
Keyboard-driven focus stopwatch TUI. Records focus sessions with start, \
end, and total duration, with themes, pause/resume, and JSON persistence.\
"""
